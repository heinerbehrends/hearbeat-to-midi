[platformio]
; Upload/build in VS Code without a chosen environment would otherwise run every
; env in turn, leaving the last one (the diag probe) on the board
default_envs = esp32-s3-n16r8
; Per-machine settings (serial ports), not committed: copy
; platformio_local.ini.example to platformio_local.ini and edit it.
; Without it PlatformIO finds the port by itself.
extra_configs = platformio_local.ini

[env:esp32-s3-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Hardware Memory Mapping ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = large_partitions.csv

; --- Automated Library Package Management ---
lib_deps =
    dfrobot/DFRobot_RTU@^1.0.6
    dfrobot/DFRobot_BloodOxygen_S@^1.0.0
    ; Listed so PlatformIO never prunes it as unused between `pio run` and
    ; `pio test` (that left the test build pointing at a deleted library)
    throwtheswitch/Unity@^2.6.1


; --- CRITICAL FIX FOR NATIVE USB MIDI ---
lib_archive = no
build_unflags = 
    -DARDUINO_USB_MODE=1

build_flags = 
    ; Enable your board's 8MB Octal PSRAM
    -DBOARD_HAS_PSRAM
    
    ; Force Core 3.x TinyUSB Drivers
    -DARDUINO_USB_MODE=0
    ; Serial goes to the hardware UART (the "COM" port with the converter chip),
    ; so the native USB port carries only MIDI. Upload, monitor and tests use the
    ; UART port, whose auto-reset wiring makes BOOT + RST unnecessary.
    -DARDUINO_USB_CDC_ON_BOOT=0

; --- Monitoring & Debugging ---
; Upload, monitor and tests use the board's UART port (CH343 converter); its
; name differs per machine, so it's set in platformio_local.ini (see above).
monitor_speed = 115200
; On the UART port DTR/RTS drive the auto-reset circuit: keep them released,
; otherwise opening the monitor holds the board in reset
monitor_dtr = 0
monitor_rts = 0
test_speed = 115200
test_framework = unity

; Sensor wiring diagnostic: pio run -e diag -t upload && pio device monitor
[env:diag]
extends = env:esp32-s3-n16r8
build_src_filter = -<*> +<../diag/>

; Seeed XIAO ESP32-S3 Plus (16 MB flash, 8 MB PSRAM) for the 1590A build.
; Pins: see the BOARD_XIAO block in include/Settings.h.
; It has a single USB-C port (native USB), carrying MIDI *and* the serial log
; (USB CDC, enabled by the board definition) for upload, monitor and tests.
[env:xiao-s3-plus]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32_s3_plus
framework = arduino
board_build.partitions = large_partitions.csv
lib_deps = ${env:esp32-s3-n16r8.lib_deps}
lib_archive = no
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_XIAO
    ; TinyUSB, so MIDI and the CDC serial port share the one USB port
    -DARDUINO_USB_MODE=0
    ; the core starts USB before setup(), so the name has to be set at build time
    '-DUSB_PRODUCT="Heart Rate To MIDI"'
; Uploads: the running firmware restarts into download mode on a 1200 baud
; touch, then the upload continues on the port that appears (no buttons needed;
; if it fails anyway: hold B, tap R, release B).
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
monitor_speed = 115200
; USB CDC may only send once the host sets DTR, so the monitor sets it (the
; settings page offers "Set DTR" for the same reason)
monitor_dtr = 1
monitor_rts = 0
test_speed = 115200
test_framework = unity
