[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 16MB Flash / 8MB OPI PSRAM mappings
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.prsam_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; CRITICAL FIX: Forces the native terminal monitor to release the chip 
; out of download mode lines so it can actually boot your test code
monitor_dtr = 1
monitor_rts = 1
test_speed = 115200
test_port = /dev/ttyACM0
